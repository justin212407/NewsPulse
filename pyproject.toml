[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "newspulse"
version = "0.1.0"
description = "A modular Streamlit app for exploring news coverage and narrative change."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.3.3",
  "plotly==6.3.1",
  "streamlit==1.50.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
nlp = [
  "sentence-transformers==5.1.1",
  "transformers==4.57.1",
  "scikit-learn==1.7.2",
  "umap-learn==0.5.9.post2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
